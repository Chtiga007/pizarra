<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizarra · Política y Economía</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Pizarra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Minimalista, una sola pantalla: arriba la frase del día, a la izquierda 8 indicadores, a la derecha 10 titulares, abajo agenda. */
:root{
  --bg:#f7f8fa; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e8ebef;
  --accent:#2f6fdb; --up:#0f9b6c; --down:#e0474c; --warn:#d48a00;
  --font:"Manrope", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --card:#161b22; --ink:#eef1f5; --muted:#8b95a3; --line:#242b35;
    --accent:#6aa0ff; --up:#34d399; --down:#ff6b6f; --warn:#f5b73b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --ink:#eef1f5; --muted:#8b95a3; --line:#242b35;
  --accent:#6aa0ff; --up:#34d399; --down:#ff6b6f; --warn:#f5b73b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.page{max-width:1240px;margin:0 auto;padding:28px 24px 32px;display:grid;gap:22px}

header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.date{color:var(--muted);font-size:13px}

.lead{font-weight:700;font-size:clamp(20px,2.3vw,26px);line-height:1.3;letter-spacing:-.015em;max-width:60ch;text-wrap:balance;margin:0}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:80ch}

.main{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ind{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;min-width:0}
.ind .k{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
.dot.verde{background:var(--up)} .dot.amarillo{background:var(--warn)} .dot.rojo{background:var(--down)}
.ind .v{font-size:clamp(19px,1.9vw,24px);font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ind .d{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.ind .d.up{color:var(--up)} .ind .d.down{color:var(--down)}
.ind.wide{grid-column:span 2;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.ind.wide svg{grid-row:1 / span 3;grid-column:2;width:100%;height:58px;display:block}
.world{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:13px}
.world div{white-space:nowrap}
.world b{font-weight:600;color:var(--muted);margin-right:6px}
.world .up{color:var(--up);font-weight:600} .world .down{color:var(--down);font-weight:600}

.news{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px;list-style:none;margin:0}
.news li{border-bottom:1px solid var(--line)}
.news li:last-child{border-bottom:0}
.news a{display:grid;grid-template-columns:1fr auto;gap:1px 12px;padding:9px 0}
.news .t{font-weight:600;font-size:14px;line-height:1.35}
.news a:hover .t{color:var(--accent)}
.news .m{font-size:11.5px;color:var(--muted);grid-column:1}
.news .tag{grid-row:1 / span 2;grid-column:2;align-self:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:3px 9px}
.news .tag.Política{color:var(--accent)}
.news .tag.Mundo{color:var(--warn)}

.agenda{display:flex;flex-wrap:wrap;gap:10px}
.ag{flex:1 1 220px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ag .w{font-size:12px;font-weight:700;color:var(--accent)}
.ag .b{font-size:14px;font-weight:600;margin-top:2px}

footer{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
footer details summary{cursor:pointer}
footer details[open]{flex-basis:100%}
footer .src{columns:3 220px;margin-top:8px}
footer .src a{display:block;padding:1px 0}
footer .src a:hover{color:var(--accent)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;opacity:0;transition:opacity .1s;z-index:9}

@media (max-width:1000px){ .main{grid-template-columns:1fr} }
@media (max-width:560px){
  .page{padding:20px 16px 28px}
  .grid{grid-template-columns:1fr 1fr}
  .ind.wide{grid-template-columns:1fr}
  .ind.wide svg{grid-row:auto;grid-column:1;height:50px}
}
/* Modo tablero: en pantallas de escritorio todo entra en una sola pantalla, sin scroll de página. */
@media (min-width:1001px) and (min-height:600px){
  html,body{height:100%;overflow:hidden}
  .page{height:100vh;height:100dvh;padding:16px 24px 12px;gap:12px;grid-template-rows:auto auto minmax(0,1fr) auto auto}
  .lead{font-size:clamp(18px,1.9vw,23px)}
  .sub{margin-top:4px;font-size:13px;line-height:1.4}
  h2{margin-bottom:8px}
  .main{min-height:0;align-items:stretch;gap:18px}
  #indicadores{min-height:0;display:flex;flex-direction:column}
  .grid{gap:8px}
  .ind{padding:10px 12px 9px;border-radius:12px}
  .ind .v{font-size:clamp(18px,1.6vw,22px);margin-top:3px}
  .ind.wide svg{height:48px}
  .world{margin-top:8px;padding:8px 12px;gap:4px 18px}
  #titulares{min-height:0;display:flex;flex-direction:column}
  .news{flex:1;min-height:0;overflow:auto;padding:2px 14px}
  .news a{padding:7px 0}
  .news .t{font-size:13.5px}
  .agenda{flex-wrap:nowrap;gap:8px}
  .ag{padding:8px 12px;border-radius:12px;min-width:0}
  .ag .b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  footer{position:relative}
  footer details[open] .src{position:absolute;bottom:22px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:50vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.15)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page" id="pizarra">
  <header>
    <div class="brand">Pizarra <span>·</span> Política y Economía</div>
    <div class="date" id="fecha"></div>
  </header>

  <section id="hoy">
    <p class="lead" id="frase"></p>
    <p class="sub" id="claves"></p>
  </section>

  <div class="main">
    <section id="indicadores">
      <h2>Argentina en números</h2>
      <div class="grid" id="grid"></div>
      <div class="world" id="mundo" aria-label="Mercados internacionales"></div>
    </section>
    <section id="titulares">
      <h2>Titulares</h2>
      <ul class="news" id="news"></ul>
    </section>
  </div>

  <section id="agenda-sec">
    <h2>Lo que viene</h2>
    <div class="agenda" id="agenda"></div>
  </section>

  <footer id="pie">
    <span id="corte"></span>
    <span>Cifras relevadas de medios y agencias; titulares resumidos con palabras propias.</span>
    <details><summary>Ver fuentes</summary><div class="src" id="fuentes"></div></details>
  </footer>
</div>
<div class="tip" id="tip"></div>

<script>
fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(D){
(function(){
  function el(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;}
  document.getElementById('fecha').textContent=D.fecha;
  document.getElementById('corte').textContent=D.corte;
  document.getElementById('frase').textContent=D.frase;
  document.getElementById('claves').textContent=(D.claves||[]).join('  ·  ');

  var grid=document.getElementById('grid'), spark=null;
  D.indicadores.forEach(function(i){
    var c=el('div','ind'+(i.serie?' wide':''));
    var k=el('div','k'); k.appendChild(el('span','dot '+(i.estado||''))); k.appendChild(document.createTextNode(i.k));
    c.appendChild(k); c.appendChild(el('div','v',i.v));
    var cls=i.k==='Riesgo país'? (i.d.trim().charAt(0)==='−'?'up':'down') : '';
    c.appendChild(el('div','d '+cls,i.d));
    if(i.serie){ spark=document.createElementNS('http://www.w3.org/2000/svg','svg'); spark.setAttribute('aria-label','Evolución del riesgo país'); c.appendChild(spark); }
    grid.appendChild(c);
  });

  var w=document.getElementById('mundo');
  (D.mundo||[]).forEach(function(m){ var d=el('div'); d.appendChild(el('b',null,m.k)); d.appendChild(document.createTextNode(m.v+' ')); d.appendChild(el('span',m.tend==='up'?'up':(m.tend==='down'?'down':''),m.d)); w.appendChild(d); });

  var ul=document.getElementById('news');
  D.titulares.forEach(function(n){ var li=el('li'); var a=el('a'); a.href=n.u; a.target='_blank'; a.rel='noopener';
    a.appendChild(el('span','t',n.t)); a.appendChild(el('span','m',n.s)); a.appendChild(el('span','tag '+n.sec,n.sec)); li.appendChild(a); ul.appendChild(li); });

  var ag=document.getElementById('agenda');
  D.agenda.forEach(function(a){ var c=el('div','ag'); c.appendChild(el('div','w',a.w)); c.appendChild(el('div','b',a.b)); ag.appendChild(c); });

  var fu=document.getElementById('fuentes');
  D.fuentes.forEach(function(f){ var a=el('a',null,f[0]); a.href=f[1]; a.target='_blank'; a.rel='noopener'; fu.appendChild(a); });

  var tip=document.getElementById('tip');
  function draw(){
    if(!spark||!D.riesgo) return;
    var NS='http://www.w3.org/2000/svg'; while(spark.firstChild) spark.removeChild(spark.firstChild);
    var W=Math.max(120,spark.clientWidth||200), H=58, p=5, data=D.riesgo, n=data.length;
    spark.setAttribute('viewBox','0 0 '+W+' '+H);
    var vs=data.map(function(d){return d[1];}), lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
    function x(i){return p+(W-2*p)*i/(n-1);} function y(v){return p+(H-2*p)*(1-(v-lo)/(hi-lo||1));}
    var col=getComputedStyle(document.documentElement).getPropertyValue('--down').trim();
    var line=data.map(function(d,i){return x(i)+','+y(d[1]);}).join(' L');
    function S(t,a){var e=document.createElementNS(NS,t); for(var k in a) e.setAttribute(k,a[k]); return e;}
    spark.appendChild(S('path',{d:'M'+x(0)+','+H+' L'+line+' L'+x(n-1)+','+H+'Z',fill:col,'fill-opacity':.1}));
    spark.appendChild(S('path',{d:'M'+line,fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
    spark.appendChild(S('circle',{cx:x(n-1),cy:y(data[n-1][1]),r:3.5,fill:col}));
    data.forEach(function(d,i){ var r=S('rect',{x:x(i)-(W/n)/2,y:0,width:W/n,height:H,fill:'transparent'});
      function show(e){ var t=e.touches?e.touches[0]:e; tip.textContent=d[0]+': '+d[1].toLocaleString('es-AR')+' pb'; tip.style.left=(t.clientX+10)+'px'; tip.style.top=(t.clientY-30)+'px'; tip.style.opacity=1; }
      r.addEventListener('mousemove',show); r.addEventListener('touchstart',show,{passive:true}); r.addEventListener('mouseleave',function(){tip.style.opacity=0;});
      spark.appendChild(r); });
  }
  draw(); var rt; window.addEventListener('resize',function(){clearTimeout(rt); rt=setTimeout(draw,120);});
  new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
}).catch(function(){ document.getElementById('frase').textContent='No se pudo cargar la información. Revisá la conexión y recargá la página.'; });
</script>
</body>
</html>
